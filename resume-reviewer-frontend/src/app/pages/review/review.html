<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>
<body>
    <div class="container">
        <main>
            <div class="py-5 text-center">
                <h1 class="h2">Resume Reviewer</h1>
            </div>
            <div class="">
                <h4 class="mb-3">Job Description</h4>
                <!-- // TODO: Check what novalidate is. -->
                <form class="jobDescForm" novalidate>
                    <label for="jobDescription" class="form-label">Job Description</label>
                    <textarea class="form-control" id="jobDescription" rows="3" [(ngModel)]="jobDesc" name="jobDesc" placeholder="Enter the job description here..."></textarea>
                    <button class="btn btn-primary" type="submit" (click)="submit()">Submit</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
